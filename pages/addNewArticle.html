<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIKKEI_EDU _BLOG</title>
    <link rel="stylesheet" href="../css/article-manager.css" />
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" />
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add New Article</title>
        <link rel="stylesheet" href="../css/addNewArticle.css" />
      </head>
      <body>
        <div class="container">
          <span class="close"
            ><a href="../pages/index.html"
              ><img
                src="../assets/icons/x-circle.png"
                width="24px"
                height="24px" /></a
          ></span>
          <img
            src="../assets/images/add-article.png"
            alt=""
            width="213px"
            height="27px"
          />

          <form action="#" method="POST">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" class="input-box" />

            <label for="categories">Article Categories:</label>
            <select
              id="categories"
              name="category"
              class="category"
              id="recent"
            >
              <option value="Daily Journal">Daily Journal</option>
              <option value="Work & Career">Work & Career</option>
              <option value="Personal Thoughts">Personal Thoughts</option>
              <option value="Emotions & Feelings">Emotions & Feelings</option>
            </select>

            <label for="mood">Mood:</label>
            <div class="mood-container">
              <input type="checkbox" id="happy" name="mood" checked />
              <label for="happy">😊 Happy</label>
            </div>

            <label for="content">Content:</label>
            <textarea class="input-content" id=""></textarea>

            <label>Status</label>
            <div class="status">
              <input type="radio" id="public" name="status" value="public" />
              <label for="public">public</label>
              <input type="radio" id="private" name="status" value="private" />
              <label for="private">private</label>
            </div>

            <label for="image">Image:</label>
            <input
              type="file"
              id="image"
              name="image"
              class="input-box"
              accept="image/*"
            />

            <button type="submit" class="btn-add">Add</button>
          </form>
        </div>
      </body>
      <script src="../js/addNewArticle.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </html>
  </body>
</html>
