<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIKKEI_EDU _BLOG</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" />
  </head>
  <body>
    <div>
      <div class="boder">
        <div>
          <img
            class="img"
            src="../assets/images/draw2.webp_login.png"
            alt=""
            width="576px"
            height="384.47px"
          />
        </div>
        <div class="container">
          <div class="social-login">
            <p>Sign in with</p>
            <button>
              <img
                src="../assets/icons/f_login.png"
                alt=""
                width="10.31px"
                height="16px"
              />
            </button>
            <button>
              <img
                src="../assets/icons/t_login.png"
                alt=""
                width="16.39px"
                height="16px"
              />
            </button>
            <button>
              <img
                src="../assets/icons/in_login.png"
                alt=""
                width="14.36px"
                height="16px"
              />
            </button>
          </div>
          <p class="or">Or</p>

          <!-- Form đăng nhập -->
          <form id="loginForm">
            <div class="input-group">
              <input
                type="email"
                id="email"
                placeholder="Enter a valid email address"
                required
              />
              <label for="email">Email address</label>
            </div>
            <div class="input-group">
              <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
              />
              <label for="password">Password</label>
            </div>
            <button type="submit" class="login-btn" id="login-btn">
              Login
            </button>
          </form>

          <!-- Liên kết đăng ký -->
          <p class="register-link">
            <strong>Don't have an account?</strong>
            <a href="../pages/register.html">Register</a>
          </p>

          <!-- Thông báo lỗi hoặc thành công -->
          <p id="message"></p>
        </div>
      </div>
    </div>

    <script src="../js/login.js"></script>

    <footer>
      <div class="text">
        <p>Copyright &copy; 2025.All rights reserved</p>
      </div>
      <div class="icons">
        <button>
          <img
            src="../assets/icons/f_login.png"
            alt=""
            width="14.45px"
            height="16px"
          />
        </button>
        <button>
          <img
            src="../assets/icons/t_login.png"
            alt=""
            width="20.45px"
            height="16px"
          />
        </button>
        <button>
          <img
            src="../assets/icons/g_login.png"
            alt=""
            width="19.7px"
            height="16px"
          />
        </button>
        <button>
          <img
            src="../assets/icons/in_login.png"
            alt=""
            width="14px"
            height="16px"
          />
        </button>
      </div>
    </footer>
  </body>
</html>
