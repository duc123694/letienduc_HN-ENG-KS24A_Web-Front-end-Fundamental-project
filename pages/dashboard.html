<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIKKEI_EDU _BLOG</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="icon" href="../assets/icons/logo.png" type="image/png" />
  </head>
  <body>
    <header>
      <nav>
        <div class="icon-header">
          <img
            src="../assets/icons/mail.png"
            alt="Mail"
            width="22px"
            height="26px"
          />
          <img
            src="../assets/icons/bell.png"
            alt="Bell"
            width="30px"
            height="24px"
          />
          <span id="user-info">
            <img
              src="../assets/icons/Avatar1.png"
              alt="Avatar"
              width="40px"
              height="40px"
              class="info"
              id="avatar"
            />
            <div class="dropdown-menu" id="dropdown-menu">
              <div class="info-a">
                <div class="avatar-container">
                  <img
                    src="../assets/icons/Avatar1.png"
                    alt="Avatar"
                    width="40px"
                    height="40px"
                    class="info-i"
                  />
                  <div class="online-status"></div>
                </div>
                <div class="info-text">
                  <p class="info-text-1">Rikkei</p>
                  <p class="info-text-2">rikkei@gmail.com</p>
                </div>
              </div>
              <ul>
                <li>
                  <a class="text-in" href="../pages/user_manager.html"
                    >View Profile</a
                  >
                </li>
                <li><a class="text-in" href="#">Update Profile Picture</a></li>
                <li><a class="text-in" href="#">Change Password</a></li>
                <li><a href="../pages/login.html" id="logout">Log Out</a></li>
              </ul>
            </div>
          </span>
        </div>
      </nav>
    </header>

    <main>
      <div class="sidebar">
        <div class="menu-btn">
          <img
            src="../assets/icons/Users_Group.png"
            alt=""
            width="24px"
            height="24px"
          /><a class="link" href="../pages/user_manager.html">Manage Users </a>
        </div>
        <div class="menu-btn">
          <img
            src="../assets/icons/Book.png"
            alt=""
            width="24px"
            height="24px"
          /><a class="link" href="../pages/dashboard.html">Manage Entries</a>
        </div>
        <div class="menu-btn">
          <img
            src="../assets/icons/Book_Open.png"
            alt=""
            width="24px"
            height="24px"
          /><a class="link" href="../pages/article-manager.html"
            >Manage Article</a
          >
        </div>
        <div class="menu-btn">
          <img
            src="../assets/icons/Log_Out.png"
            alt=""
            width="24px"
            height="24px"
          /><a class="link" href="../pages/login.html" class="out">Log out</a>
        </div>
      </div>
      <div class="main-content">
        <div class="title">
          <div class="search">
            <input
              type="text"
              placeholder="Search user"
              class="search-box"
              id="search"
            />
            <img
              src="../assets/icons/search-user.png"
              alt=""
              width="18px"
              height="18px"
              class="search-icon"
            />
          </div>
        </div>

        <div>
          <h2 class="title-manage">📂Manage Categories</h2>
          <p class="text-manage">Category Name:</p>
          <input
            type="text"
            id="categoryInput"
            class="input-box"
            placeholder="Enter category name"
          />
          <button id="addBtn" class="add-btn" onclick="addCategory()">
            Add Category
          </button>
          <h3>📋 Category List</h3>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Category Name</th>
                <th class="action">Actions</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody" id="recent"></tbody>
          </table>
        </div>

        <div class="pagination">
          <button class="but" id="prevPage">&larr; Previous</button>
          <div id="paginationContainer" class="container"></div>
          <button class="but" id="nextPage">Next &rarr;</button>
        </div>
      </div>
    </main>
    <script src="../js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
